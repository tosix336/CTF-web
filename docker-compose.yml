services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root_local_only
      MARIADB_DATABASE: vault
      MARIADB_USER: vault
      MARIADB_PASSWORD: vault_local_only
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    image: ${CTF_IMAGE:-vault-search-web:local}
    build: ./app
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: vault
      DB_USER: vault
      DB_PASSWORD: vault_local_only
      GZCTF_FLAG: ${GZCTF_FLAG:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
volumes:
  db_data:
